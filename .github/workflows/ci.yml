name: ci

# Offline checks only: nothing here reads a live source, so a new ban list or a
# delisted product cannot fail an unrelated pull request or block a release.
# The live checks run weekly in live-checks.yml.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python tools/validate.py
      - run: uv run python tools/stats.py  # the README's numbers match the data
      - name: Check the id ledger against the previous state
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ "$REF_TYPE" = "tag" ]; then
            # The previous release tag (v*), if there is one: another tag is not a release.
            if ! base="$(git describe --tags --abbrev=0 --match 'v*' 'HEAD^' 2>/dev/null)"; then
              echo "No earlier release tag: skipping the ledger check."
              exit 0
            fi
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # First push of a branch, or a force-push whose old tip is not in the clone: compare with the parent commit.
            base="HEAD~1"
          fi
          echo "Checking the ledger against $base"
          uv run python tools/ids.py --check-against "$base"

  # A v* tag pushed by a person: the same release job the weekly refresh calls (release.yml).
  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
