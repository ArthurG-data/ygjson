name: live-checks

# Checks that compare the committed data with live sources (TCGplayer/TCGCSV and
# YGOPRODeck). A failure here means the data needs refreshing; it is a signal,
# not a gate on pull requests or releases.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python tools/validate.py --online
      - run: uv run python tools/legality.py --check
