name: live-checks

# Checks that compare the committed data with live sources (TCGplayer/TCGCSV and
# YGOPRODeck). A failure here means the data needs refreshing; it is a signal,
# not a gate on pull requests or releases.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python tools/validate.py --online
      - run: uv run python tools/legality.py --check
