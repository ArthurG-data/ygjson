[project]
name = "ygjson"
version = "0.3.0"
description = "An open dataset of Yu-Gi-Oh! TCG sets, cards, printings, archetypes and sealed products"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.21"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.6",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures spell out whole records on one line.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["build", "changelog", "coverage_report", "decisions", "fetch", "ids", "import_sealed", "import_tcgcsv",
                     "import_ygojson", "import_ygoprodeck", "import_yugipedia", "legality", "package", "pipeline", "rarities",
                     "reconcile", "refresh_summary", "seed_ids", "sources", "stats", "tcgcsv", "validate", "ygjson",
                     "ygojson_aggregate", "ygoprodeck", "yugipedia"]

[tool.mypy]
python_version = "3.11"
mypy_path = "tools"
files = ["tools"]
explicit_package_bases = true
warn_unused_ignores = true
